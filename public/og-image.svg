<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="100%" stop-color="#0c0d14" />
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Logo Pill Badge -->
  <g transform="translate(100, 110)">
    <rect width="52" height="52" rx="14" fill="url(#accentGrad)" />
    <text x="26" y="32" text-anchor="middle" dominant-baseline="central" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="bold" font-size="28" fill="#ffffff">S</text>
    <text x="70" y="32" dominant-baseline="central" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="22" fill="#ffffff">Sanjay Akula</text>
    <rect x="235" y="16" width="140" height="32" rx="16" fill="rgba(99,102,241,0.18)" stroke="rgba(99,102,241,0.4)" stroke-width="1" />
    <circle cx="252" cy="32" r="4" fill="#10B981" />
    <text x="264" y="32" dominant-baseline="central" font-family="monospace" font-size="12" fill="#a5b4fc">PORTFOLIO</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="270" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1">
    I build things that <tspan fill="url(#accentGrad)">matter.</tspan>
  </text>

  <!-- Subheadline -->
  <text x="100" y="350" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="26" fill="#94a3b8">
    Developer · Designer · Problem Solver
  </text>
  <text x="100" y="390" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="22" fill="#64748b">
    Full-Stack Web Platforms · Responsive Systems · High-Fidelity UI/UX
  </text>

  <!-- Tags -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="110" height="42" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="55" y="21" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="14" fill="#e2e8f0">React</text>

    <rect x="125" y="0" width="110" height="42" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="180" y="21" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="14" fill="#e2e8f0">Python</text>

    <rect x="250" y="0" width="100" height="42" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="300" y="21" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="14" fill="#e2e8f0">SQL</text>

    <rect x="365" y="0" width="130" height="42" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="430" y="21" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="14" fill="#e2e8f0">Firebase</text>

    <rect x="510" y="0" width="140" height="42" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="580" y="21" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="14" fill="#e2e8f0">Tailwind CSS</text>
  </g>
</svg>
